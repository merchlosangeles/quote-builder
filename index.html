const FEE_DEFS = [
  { key: "rush",        label: "Rush Fee",        icon: "⚡" },
  { key: "setup",       label: "Setup Fee",       icon: "🔧" },
  { key: "convenience", label: "Convenience Fee", icon: "🤝" },
  { key: "misc",        label: "Misc Fee",        icon: "➕" },
];

const DEFAULT_FEES = Object.fromEntries(
  FEE_DEFS.map(f => [f.key, { enabled: false, mode: "flat", value: "", label: f.label }])
);

const EMPTY_LINE = () => ({
  id: Date.now() + Math.random(),
  description: "",
  qty: "",
  standardPrice: "",
  bulkDiscount: "",
  bulkDiscountMode: "percent", // "percent" or "flat"
  lineFeeLabel: "",
  lineFeeAmount: "",
  // private
  blankSku: "",
  blankCostPerUnit: "",
  dtfFront: "",
  dtfBack: "",
  pressedInHouse: false,
  costPerUnit: "",
});

function fmt(val) {
  const n = parseFloat(val);
  return isNaN(n) ? "$0.00" : "$" + n.toFixed(2);
}

function calcLine(line) {
  const qty      = parseFloat(line.qty) || 0;
  const std      = parseFloat(line.standardPrice) || 0;
  const discRaw  = parseFloat(line.bulkDiscount) || 0;
  const discMode = line.bulkDiscountMode || "percent";
  const cpu      = parseFloat(line.costPerUnit) || 0;
  const blank    = parseFloat(line.blankCostPerUnit) || 0;
  const lineFee  = parseFloat(line.lineFeeAmount) || 0;
  const pressing = line.pressedInHouse ? 1 : 0;

  const dtfCost  = (DTF_COST[line.dtfFront] || 0) + (DTF_COST[line.dtfBack] || 0);

  const stdSubtotal = std * qty;

  let bulkPrice = null;
  if (discRaw > 0) {
    bulkPrice = discMode === "flat" ? std - discRaw : std * (1 - discRaw / 100);
    if (bulkPrice < 0) bulkPrice = 0;
  }
  const bulkSubtotal = bulkPrice !== null ? bulkPrice * qty : null;

  const totalCost = (cpu + blank + pressing + dtfCost) * qty + lineFee;

  // Suggested price: (blank + dtf + pressing + service fee) × markup
  const suggestedPrice = (blank + dtfCost) > 0 ? (blank + dtfCost + (line.pressedInHouse ? 1 : 0) + SERVICE_FEE) * MARKUP : null;

  return { qty, std, discRaw, discMode, stdSubtotal, bulkPrice, bulkSubtotal, lineFee, totalCost, pressing, dtfCost, suggestedPrice };
}

// ─── Quote Form ───────────────────────────────────────────────────────────────
function QuoteForm({ onSave, editQuote, onCancel, logoBase64 }) {
  const [requestedBy, setRequestedBy] = useState(editQuote?.requestedBy || "");
  const [organization, setOrganization] = useState(editQuote?.organization || "");
  const [date, setDate] = useState(editQuote?.date || new Date().toLocaleDateString("en-US", { month: "2-digit", day: "2-digit", year: "numeric" }));
  const [lines, setLines] = useState(editQuote?.lines || [EMPTY_LINE()]);
  const [shipping, setShipping] = useState(editQuote?.shipping ?? "0");
  const [fees, setFees] = useState(editQuote?.fees || DEFAULT_FEES);
  const [taxEnabled, setTaxEnabled] = useState(editQuote?.taxEnabled ?? false);
  const [taxRate, setTaxRate] = useState(editQuote?.taxRate ?? "10.25");

  function updateLine(idx, updated) { setLines(ls => ls.map((l, i) => i === idx ? updated : l)); }
  function addLine() { setLines(ls => [...ls, EMPTY_LINE()]); }
  function removeLine(idx) { setLines(ls => ls.filter((_, i) => i !== idx)); }

  // Totals
  const lineCalcs = lines.map(calcLine);
  const stdProductSubtotal = lineCalcs.reduce((s, c) => s + c.stdSubtotal, 0);
  const stdTotal  = lineCalcs.reduce((s, c) => s + c.stdSubtotal + c.lineFee, 0);
  const hasBulk   = lines.some(l => l.bulkDiscount && parseFloat(l.bulkDiscount) > 0);
  const bulkProductSubtotal = lineCalcs.reduce((s, c) => s + (c.bulkSubtotal !== null ? c.bulkSubtotal : c.stdSubtotal), 0);
  const bulkBase  = lineCalcs.reduce((s, c) => s + (c.bulkSubtotal !== null ? c.bulkSubtotal : c.stdSubtotal) + c.lineFee, 0);
  const ship      = parseFloat(shipping) || 0;

  // Tax on product subtotal only
  const taxRateNum = parseFloat(taxRate) || 0;
  const stdTax  = taxEnabled ? stdProductSubtotal * (taxRateNum / 100) : 0;
  const bulkTax = taxEnabled ? bulkProductSubtotal * (taxRateNum / 100) : 0;

  // Fees applied to bulk (or std if no bulk)
  const baseForFees = hasBulk ? bulkBase : stdTotal;
  let totalFees = 0;
  const feeBreakdown = [];
  FEE_DEFS.forEach(fd => {
    const f = fees[fd.key];
    if (!f?.enabled || !f.value) return;
    const val = parseFloat(f.value);
    if (isNaN(val) || val === 0) return;
    const amount = f.mode === "flat" ? val : baseForFees * (val / 100);
    feeBreakdown.push({ ...fd, label: f.label || fd.label, mode: f.mode, inputVal: val, amount });
    totalFees += amount;
  });

  const stdGrand   = stdTotal + stdTax + ship + totalFees;
  const bulkGrand  = bulkBase + bulkTax + ship + totalFees;
  const saved      = stdGrand - bulkGrand;
  const totalCost  = lineCalcs.reduce((s, c) => s + c.totalCost, 0) + ship;
  const profit     = (hasBulk ? bulkGrand : stdGrand) - totalCost;

  function handleSave() {
    if (!organization && !requestedBy) return;
    onSave({
      id: editQuote?.id || Date.now(),
      requestedBy, organization, date, lines, shipping, fees,
      taxEnabled, taxRate,
      totals: { stdTotal, bulkBase, hasBulk, ship, totalFees, feeBreakdown, stdGrand, bulkGrand, saved, totalCost, profit, stdTax, bulkTax, taxRateNum },
      createdAt: editQuote?.createdAt || new Date().toISOString(),
    });
  }

  return (
    <div style={{ paddingBottom: 80 }}>
      {/* Header info */}
      <div style={{ background: "white", borderRadius: 14, border: "1.5px solid #dde3ee", padding: 16, marginBottom: 16, boxShadow: "0 2px 8px rgba(26,39,68,0.05)" }}>
        <div style={{ marginBottom: 12 }}>
          <Label>Requested By</Label>
          <Input value={requestedBy} onChange={setRequestedBy} placeholder="Contact name" />
        </div>
        <div style={{ marginBottom: 12 }}>
          <Label>Organization</Label>
          <Input value={organization} onChange={setOrganization} placeholder="Team / company name" />
        </div>
        <div>
          <Label>Date</Label>
          <Input value={date} onChange={setDate} placeholder="MM/DD/YYYY" />
        </div>
      </div>

      {/* Line items */}
      <div style={{ fontSize: 12, fontWeight: 800, color: NAVY, letterSpacing: 1, textTransform: "uppercase", marginBottom: 8, fontFamily: "system-ui,sans-serif" }}>Line Items</div>
      {lines.map((line, idx) => (
        <LineEditor key={line.id} line={line} index={idx}
          onChange={updated => updateLine(idx, updated)}
          onRemove={() => removeLine(idx)}
          showRemove={lines.length > 1} />
      ))}
      <button onClick={addLine} style={{ width: "100%", padding: "12px", borderRadius: 10, border: `2px dashed #dde3ee`, background: "transparent", color: TEAL, fontFamily: "inherit", fontSize: 14, fontWeight: 700, cursor: "pointer", marginBottom: 16 }}>
        + Add Line Item
      </button>

      {/* Shipping */}
      <div style={{ background: "white", borderRadius: 14, border: "1.5px solid #dde3ee", padding: 16, marginBottom: 16 }}>
        <Label>Shipping</Label>
        <div style={{ position: "relative" }}>
          <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", fontSize: 13, color: "#6b7a99", fontWeight: 700 }}>$</span>
          <Input value={shipping} onChange={setShipping} type="number" min="0" step="0.01" placeholder="0.00" style={{ paddingLeft: 22 }} />
        </div>
      </div>

      {/* Fees */}
      <div style={{ background: "white", borderRadius: 14, border: "1.5px solid #dde3ee", padding: 16, marginBottom: 16 }}>
        <FeesSection fees={fees} onChange={setFees} />
      </div>

      {/* CA Tax */}
      <div style={{ background: "white", borderRadius: 14, border: `1.5px solid ${taxEnabled ? TEAL : "#dde3ee"}`, padding: 16, marginBottom: 16, transition: "border-color 0.15s" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: taxEnabled ? 12 : 0 }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: taxEnabled ? TEAL_DARK : NAVY, fontFamily: "system-ui,sans-serif" }}>🏛️ CA Sales Tax</div>
            <div style={{ fontSize: 11, color: "#8899bb", fontFamily: "system-ui,sans-serif" }}>Applied to product subtotal only</div>
          </div>
          <Toggle checked={taxEnabled} onChange={setTaxEnabled} label="" />
        </div>
        {taxEnabled && (
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ position: "relative", flex: 1 }}>
              <Input value={taxRate} onChange={setTaxRate} type="number" min="0" max="15" step="0.01" placeholder="10.25" style={{ paddingRight: 28 }} />
              <span style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", fontSize: 13, color: "#6b7a99", fontWeight: 700 }}>%</span>
            </div>
            <div style={{ fontSize: 13, color: TEAL_DARK, fontWeight: 700, whiteSpace: "nowrap" }}>
              = {fmt(hasBulk ? bulkTax : stdTax)}
            </div>
          </div>
        )}
      </div>

      {/* Bulk Tier Reference */}
      {lines.some(l => l.standardPrice && parseFloat(l.standardPrice) > 0) && (
        <div style={{ background: "white", borderRadius: 14, border: "1.5px solid #dde3ee", padding: 16, marginBottom: 16 }}>
          <div style={{ fontSize: 12, fontWeight: 800, color: NAVY, letterSpacing: 1, textTransform: "uppercase", marginBottom: 12, fontFamily: "system-ui,sans-serif" }}>📊 Bulk Tier Reference</div>
          {lines.filter(l => l.standardPrice && parseFloat(l.standardPrice) > 0).map((line, idx) => {
            const std = parseFloat(line.standardPrice);
            const c = calcLine(line);
            const costPerUnit = c.totalCost / (parseFloat(line.qty) || 1);
            const tiers = [5, 10, 15, 20, 25];
            return (
              <div key={line.id} style={{ marginBottom: idx < lines.length - 1 ? 16 : 0 }}>
                {lines.filter(l => l.standardPrice).length > 1 && (
                  <div style={{ fontSize: 11, color: "#8899bb", fontFamily: "system-ui,sans-serif", marginBottom: 6 }}>Line {idx + 1}: {line.description?.slice(0, 40) || "—"}</div>
                )}
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, fontFamily: "system-ui,sans-serif" }}>
                    <thead>
                      <tr style={{ background: "#f7f9fd" }}>
                        <th style={{ padding: "7px 8px", textAlign: "left", color: "#6b7a99", fontWeight: 700, fontSize: 10, textTransform: "uppercase", letterSpacing: 0.8 }}>Discount</th>
                        <th style={{ padding: "7px 8px", textAlign: "right", color: "#6b7a99", fontWeight: 700, fontSize: 10, textTransform: "uppercase", letterSpacing: 0.8 }}>Price/pc</th>
                        <th style={{ padding: "7px 8px", textAlign: "right", color: "#6b7a99", fontWeight: 700, fontSize: 10, textTransform: "uppercase", letterSpacing: 0.8 }}>Margin</th>
                        <th style={{ padding: "7px 8px", textAlign: "right", color: "#6b7a99", fontWeight: 700, fontSize: 10, textTransform: "uppercase", letterSpacing: 0.8 }}>vs Cost</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr style={{ borderBottom: "1px solid #eef0f5" }}>
                        <td style={{ padding: "7px 8px", color: NAVY, fontWeight: 700 }}>No discount</td>
                        <td style={{ padding: "7px 8px", textAlign: "right", color: NAVY, fontWeight: 700 }}>{fmt(std)}</td>
                        <td style={{ padding: "7px 8px", textAlign: "right", color: "#4caf7d", fontWeight: 700 }}>{std > 0 ? ((std - costPerUnit) / std * 100).toFixed(1) : 0}%</td>
                        <td style={{ padding: "7px 8px", textAlign: "right", color: "#4caf7d", fontWeight: 700 }}>{fmt(std - costPerUnit)}</td>
                      </tr>
                      {tiers.map(pct => {
                        const price = std * (1 - pct / 100);
                        const margin = std > 0 ? (price - costPerUnit) / price * 100 : 0;
                        const profit = price - costPerUnit;
                        const ok = profit > 0;
                        return (
                          <tr key={pct} style={{ borderBottom: "1px solid #eef0f5", background: !ok ? "#fff5f5" : "white" }}>
                            <td style={{ padding: "7px 8px", color: TEAL_DARK, fontWeight: 700 }}>{pct}% off</td>
                            <td style={{ padding: "7px 8px", textAlign: "right", color: NAVY }}>{fmt(price)}</td>
                            <td style={{ padding: "7px 8px", textAlign: "right", color: ok ? "#4caf7d" : "#e74c3c", fontWeight: 700 }}>{margin.toFixed(1)}%</td>
                            <td style={{ padding: "7px 8px", textAlign: "right", color: ok ? "#4caf7d" : "#e74c3c", fontWeight: 700 }}>{fmt(profit)}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Summary */}
      <div style={{ background: `linear-gradient(135deg, ${NAVY}, #223366)`, borderRadius: 16, padding: 20, marginBottom: 16, color: "white" }}>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 2, opacity: 0.6, marginBottom: 14, textTransform: "uppercase", fontFamily: "system-ui,sans-serif" }}>Quote Summary</div>
        <Row label="Standard Order Total" value={fmt(stdGrand)} />
        {hasBulk && <>
          <Row label="Bulk Order Total" value={fmt(bulkGrand)} accent />
          <Row label="Client Saves" value={fmt(saved)} green />
        </>}
        {feeBreakdown.map(f => <Row key={f.key} label={`${f.label}${f.mode === "percent" ? ` (${f.inputVal}%)` : ""}`} value={fmt(f.amount)} small />)}
        {taxEnabled && <Row label={`CA Tax (${taxRate}%)`} value={fmt(hasBulk ? bulkTax : stdTax)} small />}
        <div style={{ borderTop: "1px solid rgba(255,255,255,0.15)", marginTop: 12, paddingTop: 12 }}>
          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 1.5, opacity: 0.5, textTransform: "uppercase", marginBottom: 8, fontFamily: "system-ui,sans-serif" }}>🔒 Private</div>
          <Row label="Your Total Cost" value={fmt(totalCost)} small />
          <Row label="Your Profit" value={fmt(profit)} green={profit > 0} small />
        </div>
      </div>

      <PrimaryBtn onClick={handleSave} disabled={!organization && !requestedBy} style={{ width: "100%", padding: 15, fontSize: 16 }}>
        💾 Save Quote
      </PrimaryBtn>
      {onCancel && <GhostBtn onClick={onCancel} style={{ width: "100%", marginTop: 10, padding: 13 }}>Cancel</GhostBtn>}
    </div>
  );
}

function Row({ label, value, accent, green, small }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: small ? "3px 0" : "5px 0" }}>
      <span style={{ fontSize: small ? 12 : 14, opacity: small ? 0.7 : 1 }}>{label}</span>
      <span style={{ fontSize: small ? 13 : 16, fontWeight: 800, color: accent ? TEAL : green ? "#4caf7d" : "white" }}>{value}</span>
    </div>
  );
}

// ─── PDF Generator ────────────────────────────────────────────────────────────
async function generatePDF(quote, logoBase64) {
  // Dynamically load jsPDF
  if (!window.jspdf) {
    await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const t = quote.totals;
  const PW = 612, PH = 792;
  const ML = 60, MR = 60, MT = 60;
  let y = MT;

  // Colors
  const navy = [26, 39, 68];
  const teal = [0, 180, 200];
  const gray = [107, 122, 153];
  const ltgray = [238, 240, 245];

  // Logo
  if (logoBase64) {
    try {
      const imgW = 180, imgH = 62;
      doc.addImage(logoBase64, "PNG", (PW - imgW) / 2, y, imgW, imgH);
      y += imgH + 24;
    } catch { y += 20; }
  } else {
    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.setTextColor(...navy);
    doc.text("MERCH LOS ANGELES", PW / 2, y + 20, { align: "center" });
    y += 44;
  }

  // Divider
  doc.setDrawColor(...teal);
  doc.setLineWidth(1.5);
  doc.line(ML, y, PW - MR, y);
  y += 16;

  // QUOTE title + meta
  doc.setFont("helvetica", "bold");
  doc.setFontSize(22);
  doc.setTextColor(...navy);
  doc.text("QUOTE", ML, y);

  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.setTextColor(...gray);
  const metaX = PW - MR;
  doc.text("Date: " + quote.date, metaX, y - 8, { align: "right" });
  if (quote.requestedBy) doc.text("Requested By: " + quote.requestedBy, metaX, y + 4, { align: "right" });
  if (quote.organization) doc.text("Organization: " + quote.organization, metaX, y + 16, { align: "right" });
  y += 32;

  // Table header
  const cols = { desc: ML, qty: 310, std: 370, disc: 430, ppc: 490, total: 550 };
  doc.setFillColor(...teal);
  doc.rect(ML, y, PW - ML - MR, 18, "F");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(8);
  doc.setTextColor(255, 255, 255);
  doc.text("PRODUCT DESCRIPTION", cols.desc + 4, y + 12);
  doc.text("QTY", cols.qty, y + 12, { align: "center" });
  doc.text("STD PRICE", cols.std, y + 12, { align: "center" });
  doc.text("BULK DISC.", cols.disc, y + 12, { align: "center" });
  doc.text("PRICE/PC", cols.ppc, y + 12, { align: "center" });
  doc.text("TOTAL", cols.total + 10, y + 12, { align: "right" });
  y += 26;

  // Line items
  quote.lines.forEach((line, idx) => {
    const c = calcLine(line);
    const hasBulk = c.bulkPrice !== null;

    // Alternating row bg
    if (idx % 2 === 0) {
      doc.setFillColor(247, 249, 253);
      doc.rect(ML, y - 4, PW - ML - MR, 32, "F");
    }

    // Description — wrap long text
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(...navy);
    const descLines = doc.splitTextToSize(line.description, 230);
    doc.text(descLines, cols.desc + 4, y + 8);
    const rowH = Math.max(26, descLines.length * 13 + 10);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(...navy);
    doc.text(String(line.qty), cols.qty, y + 8, { align: "center" });
    doc.text(fmt(c.std), cols.std, y + 8, { align: "center" });

    if (hasBulk) {
      doc.setTextColor(...teal);
      doc.setFont("helvetica", "bold");
      doc.text(line.bulkDiscount + "%", cols.disc, y + 8, { align: "center" });
      doc.text(fmt(c.bulkPrice), cols.ppc, y + 8, { align: "center" });
      doc.setTextColor(...navy);
    } else {
      doc.setTextColor(180, 180, 180);
      doc.text("—", cols.disc, y + 8, { align: "center" });
      doc.text("—", cols.ppc, y + 8, { align: "center" });
      doc.setTextColor(...navy);
    }

    doc.setFont("helvetica", "bold");
    doc.setTextColor(...navy);
    doc.text(fmt(hasBulk ? c.bulkSubtotal : c.stdSubtotal), cols.total + 10, y + 8, { align: "right" });

    y += rowH;

    // Line fee
    if (line.lineFeeLabel && parseFloat(line.lineFeeAmount) > 0) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.setTextColor(...gray);
      doc.text(line.lineFeeLabel + ":", cols.desc + 4, y);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(...navy);
      doc.text(fmt(line.lineFeeAmount), cols.total + 10, y, { align: "right" });
      y += 14;
    }

    // Row divider
    doc.setDrawColor(...ltgray);
    doc.setLineWidth(0.5);
    doc.line(ML, y, PW - MR, y);
    y += 8;
  });

  y += 8;

  // Shipping & fees
  if (parseFloat(quote.shipping) > 0) {
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(...gray);
    doc.text("Shipping", ML + 4, y);
    doc.text(fmt(quote.shipping), cols.total + 10, y, { align: "right" });
    y += 16;
  }
  t.feeBreakdown?.forEach(f => {
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(...gray);
    doc.text(f.label + (f.mode === "percent" ? " (" + f.inputVal + "%)" : ""), ML + 4, y);
    doc.setFont("helvetica", "bold");
    doc.setTextColor(...navy);
    doc.text(fmt(f.amount), cols.total + 10, y, { align: "right" });
    y += 16;
  });

  // Totals section
  doc.setDrawColor(...ltgray);
  doc.setLineWidth(1);
  doc.line(ML, y, PW - MR, y);
  y += 14;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(11);
  doc.setTextColor(...navy);
  doc.text("Standard Order Total:", ML + 4, y);
  doc.setFont("helvetica", "bold");
  doc.text(fmt(t.stdGrand), cols.total + 10, y, { align: "right" });
  y += 18;

  if (t.hasBulk) {
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.setTextColor(...teal);
    doc.text("Bulk Order Total:", ML + 4, y);
    doc.text(fmt(t.bulkGrand), cols.total + 10, y, { align: "right" });
    y += 18;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);
    doc.text("You Saved:", ML + 4, y);
    doc.setFont("helvetica", "bold");
    doc.text(fmt(t.saved), cols.total + 10, y, { align: "right" });
    y += 20;
  }

  // Tagline
  y += 8;
  doc.setFont("helvetica", "bolditalic");
  doc.setFontSize(10);
  doc.setTextColor(...teal);
  doc.text("Order more to maximize savings on future bulk tiers!", PW / 2, y, { align: "center" });
  y += 24;

  // Payment box
  doc.setFillColor(247, 249, 253);
  doc.setDrawColor(...ltgray);
  doc.roundedRect(ML, y, PW - ML - MR, 56, 4, 4, "FD");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(10);
  doc.setTextColor(...navy);
  doc.text("Payment Options:", ML + 12, y + 14);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.setTextColor(...gray);
  doc.text("Zelle: teammerchla@gmail.com", ML + 12, y + 28);
  doc.text("CashApp: $merchlosangeles    |    Venmo: @merchlosangeles.com", ML + 12, y + 40);
  y += 68;

  // Prepared by
  doc.setFont("helvetica", "italic");
  doc.setFontSize(9);
  doc.setTextColor(...gray);
  doc.text("Prepared by: Elizabeth@merchlosangeles.com", PW - MR, y, { align: "right" });

  // Save
  const filename = "Quote_" + (quote.organization || quote.requestedBy || "MLA").replace(/\s+/g, "_") + "_" + quote.date.replace(/\//g, "-") + ".pdf";
  doc.save(filename);
}

// ─── Quote Preview (client-facing) ───────────────────────────────────────────
function QuotePreview({ quote, logoBase64, onClose }) {
  const t = quote.totals;
  const [pdfLoading, setPdfLoading] = useState(false);

  async function handlePDF() {
    setPdfLoading(true);
    try { await generatePDF(quote, logoBase64); }
    catch (e) { alert("PDF generation failed: " + e.message); }
    finally { setPdfLoading(false); }
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(26,39,68,0.75)", zIndex: 200, overflow: "auto", padding: "20px 16px 40px" }}>

      {/* Action buttons — above the page */}
      <div style={{ maxWidth: 816, margin: "0 auto 12px", display: "flex", gap: 8 }}>
        <PrimaryBtn onClick={handlePDF} style={{ flex: 1 }}>{pdfLoading ? "⏳ Generating..." : "⬇️ Download PDF"}</PrimaryBtn>
        <PrimaryBtn onClick={() => {
          const subject = encodeURIComponent("Quote — " + (quote.organization || quote.requestedBy));
          const t = quote.totals;
          const bodyLines = [
            "Hi" + (quote.requestedBy ? " " + quote.requestedBy.split(" ")[0] : "") + ",",
            "", "Thank you for your interest! Please find your quote below.", "",
            "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━",
            "QUOTE — " + (quote.organization || quote.requestedBy),
            "Date: " + quote.date,
            "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", "",
          ];
          quote.lines.forEach(line => {
            const c = calcLine(line);
            const hasBulk = c.bulkPrice !== null;
            const pricingStr = hasBulk
              ? "  |  Bulk Disc: " + line.bulkDiscount + "%  |  Price/pc: " + fmt(c.bulkPrice) + "  |  Subtotal: " + fmt(c.bulkSubtotal)
              : "  |  Subtotal: " + fmt(c.stdSubtotal);
            bodyLines.push(line.description);
            bodyLines.push("  Qty: " + line.qty + "  |  Std Price: " + fmt(c.std) + pricingStr);
            if (line.lineFeeLabel && parseFloat(line.lineFeeAmount) > 0) bodyLines.push("  " + line.lineFeeLabel + ": " + fmt(line.lineFeeAmount));
            bodyLines.push("");
          });
          if (parseFloat(quote.shipping) > 0) bodyLines.push("Shipping: " + fmt(quote.shipping));
          t.feeBreakdown?.forEach(f => bodyLines.push(f.label + ": " + fmt(f.amount)));
          bodyLines.push("", "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");
          bodyLines.push("Standard Order Total: " + fmt(t.stdGrand));
          if (t.hasBulk) { bodyLines.push("Bulk Order Total:      " + fmt(t.bulkGrand)); bodyLines.push("You Saved:             " + fmt(t.saved)); }
          bodyLines.push("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━", "", "Order more to maximize savings on future bulk tiers!", "", "Payment Options:", "  Zelle:   teammerchla@gmail.com", "  CashApp: $merchlosangeles", "  Venmo:   @merchlosangeles.com", "", "Prepared by: Elizabeth@merchlosangeles.com", "Merch Los Angeles | merchlosangeles.com");
          window.location.href = "mailto:?subject=" + subject + "&body=" + encodeURIComponent(bodyLines.join("\n"));
        }} style={{ flex: 1, background: "linear-gradient(135deg, " + NAVY + ", #2a3f6b)" }}>✉️ Email</PrimaryBtn>
        <GhostBtn onClick={() => copyQuoteText(quote)} style={{ flex: 1, background: "white" }}>📋 Copy</GhostBtn>
        <GhostBtn onClick={onClose} style={{ background: "white" }}>✕</GhostBtn>
      </div>

      {/* 8.5×11 page */}
      <div id="print-page" style={{
        width: 816, minHeight: 1056,
        margin: "0 auto",
        background: "white",
        boxShadow: "0 8px 40px rgba(0,0,0,0.4)",
        padding: "72px 72px 72px",
        boxSizing: "border-box",
        fontFamily: "'Georgia','Times New Roman',serif",
      }}>
        {/* Logo */}
        <div style={{ textAlign: "center", marginBottom: 32 }}>
          {logoBase64
            ? <img src={logoBase64} alt="Merch Los Angeles" style={{ maxHeight: 80, maxWidth: 280, objectFit: "contain" }} />
            : <div style={{ fontSize: 22, fontWeight: 800, color: NAVY, letterSpacing: 3 }}>MERCH LOS ANGELES</div>
          }
        </div>

        {/* Quote meta */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 28 }}>
          <div style={{ fontSize: 28, fontWeight: 800, color: NAVY, letterSpacing: 1 }}>QUOTE</div>
          <div style={{ textAlign: "right", fontSize: 13, lineHeight: 2, color: NAVY }}>
            <div><strong>Date:</strong> {quote.date}</div>
            {quote.requestedBy && <div><strong>Requested By:</strong> {quote.requestedBy}</div>}
            {quote.organization && <div><strong>Organization:</strong> {quote.organization}</div>}
          </div>
        </div>

        {/* Table header */}
        <div style={{ display: "grid", gridTemplateColumns: "3fr 60px 80px 80px 80px 80px", gap: 8, borderBottom: "2px solid " + TEAL, paddingBottom: 8, marginBottom: 12 }}>
          {["Product Description","QTY","Std Price","Bulk Disc.","Price/pc","Total"].map((h, i) => (
            <div key={h} style={{ fontSize: 11, fontWeight: 800, color: TEAL, textTransform: "uppercase", letterSpacing: 0.8, textAlign: i > 0 ? "center" : "left" }}>{h}</div>
          ))}
        </div>

        {/* Line items */}
        {quote.lines.map((line) => {
          const c = calcLine(line);
          const hasBulk = c.bulkPrice !== null;
          return (
            <div key={line.id} style={{ borderBottom: "1px solid #eef0f5", paddingBottom: 12, marginBottom: 12 }}>
              <div style={{ display: "grid", gridTemplateColumns: "3fr 60px 80px 80px 80px 80px", gap: 8, alignItems: "start" }}>
                <div style={{ fontSize: 13, color: NAVY, lineHeight: 1.6 }}>{line.description}</div>
                <div style={{ fontSize: 13, textAlign: "center", color: NAVY }}>{line.qty}</div>
                <div style={{ fontSize: 13, textAlign: "center", color: NAVY }}>{fmt(c.std)}</div>
                <div style={{ fontSize: 13, textAlign: "center", color: hasBulk ? TEAL_DARK : "#ccc", fontWeight: hasBulk ? 700 : 400 }}>{hasBulk ? line.bulkDiscount + "%" : "—"}</div>
                <div style={{ fontSize: 13, textAlign: "center", color: hasBulk ? TEAL_DARK : "#ccc", fontWeight: hasBulk ? 700 : 400 }}>{hasBulk ? fmt(c.bulkPrice) : "—"}</div>
                <div style={{ fontSize: 13, textAlign: "center", color: NAVY, fontWeight: 700 }}>{fmt(hasBulk ? c.bulkSubtotal : c.stdSubtotal)}</div>
              </div>
              {line.lineFeeLabel && parseFloat(line.lineFeeAmount) > 0 && (
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#6b7a99", marginTop: 6, paddingLeft: 4 }}>
                  <span>{line.lineFeeLabel}:</span>
                  <span style={{ fontWeight: 700, color: NAVY }}>{fmt(line.lineFeeAmount)}</span>
                </div>
              )}
            </div>
          );
        })}

        {/* Shipping */}
        {parseFloat(quote.shipping) > 0 && (
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "4px 0", color: "#6b7a99" }}>
            <span>Shipping</span><span>{fmt(quote.shipping)}</span>
          </div>
        )}

        {/* Fee lines */}
        {t.feeBreakdown?.map(f => (
          <div key={f.key} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "3px 0", color: "#6b7a99" }}>
            <span>{f.label}{f.mode === "percent" ? " (" + f.inputVal + "%)" : ""}</span>
            <span style={{ fontWeight: 700, color: NAVY }}>{fmt(f.amount)}</span>
          </div>
        ))}

        {/* Totals */}
        <div style={{ marginTop: 20, paddingTop: 16, borderTop: "2px solid #eef0f5" }}>
          <TotalRow label="Standard Order Total:" value={fmt(t.stdGrand)} />
          {t.hasBulk && <>
            <TotalRow label="Bulk Order Total:" value={fmt(t.bulkGrand)} bold teal />
            <TotalRow label="You Saved:" value={fmt(t.saved)} teal />
          </>}
          {quote.taxEnabled && (
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#6b7a99", padding: "3px 0" }}>
              <span>CA Sales Tax ({quote.taxRate}% on product subtotal)</span>
              <span style={{ fontWeight: 700, color: NAVY }}>{fmt(t.hasBulk ? t.bulkTax : t.stdTax)}</span>
            </div>
          )}
        </div>

        {/* Tagline */}
        <div style={{ marginTop: 20, fontSize: 13, fontWeight: 700, color: TEAL, textAlign: "center" }}>
          Order more to maximize savings on future bulk tiers!
        </div>

        {/* Payment */}
        <div style={{ marginTop: 24, padding: "16px 20px", background: "#f7f9fd", borderRadius: 8 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: NAVY, marginBottom: 8 }}>Payment Options:</div>
          <div style={{ fontSize: 12, color: "#6b7a99", lineHeight: 2 }}>
            Zelle: teammerchla@gmail.com &nbsp;&nbsp;|&nbsp;&nbsp; CashApp: $merchlosangeles &nbsp;&nbsp;|&nbsp;&nbsp; Venmo: @merchlosangeles.com
          </div>
        </div>

        <div style={{ marginTop: 16, fontSize: 11, color: "#8899bb", textAlign: "right" }}>
          Prepared by: Elizabeth@merchlosangeles.com
        </div>
      </div>

      <style>{`
        @media print {
          body > * { display: none !important; }
          #print-page {
            display: block !important;
            position: fixed !important;
            top: 0; left: 0;
            width: 8.5in !important;
            min-height: 11in !important;
            margin: 0 !important;
            padding: 0.75in !important;
            box-shadow: none !important;
            box-sizing: border-box !important;
          }
        }
      `}</style>
    </div>
  );
}


function TotalRow({ label, value, bold, teal }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", fontSize: teal ? 15 : 13 }}>
      <span style={{ fontWeight: bold ? 700 : 500, color: teal ? TEAL_DARK : NAVY }}>{label}</span>
      <span style={{ fontWeight: 800, color: teal ? TEAL_DARK : NAVY, textDecoration: teal && !bold ? "underline" : "none" }}>{value}</span>
    </div>
  );
}

// ─── Saved Quote Card ────────────────────────────────────────────────────────
function QuoteCard({ quote, onDelete, onEdit, onPreview }) {
  const [expanded, setExpanded] = useState(false);
  const t = quote.totals;

  return (
    <div style={{ background: "white", borderRadius: 14, border: "1.5px solid #dde3ee", marginBottom: 12, overflow: "hidden", boxShadow: "0 2px 10px rgba(26,39,68,0.06)" }}>
      <div onClick={() => setExpanded(e => !e)} style={{ padding: 16, cursor: "pointer", display: "flex", alignItems: "center", gap: 12 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontWeight: 700, color: NAVY, fontSize: 15, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
            {quote.organization || quote.requestedBy || "Untitled"}
          </div>
          <div style={{ fontSize: 12, color: "#6b7a99", marginTop: 2 }}>
            {quote.requestedBy && `${quote.requestedBy} · `}{quote.date} · {quote.lines.length} line{quote.lines.length > 1 ? "s" : ""}
          </div>
        </div>
        <div style={{ textAlign: "right", flexShrink: 0 }}>
          <div style={{ fontWeight: 800, color: TEAL_DARK, fontSize: 16 }}>{fmt(t?.hasBulk ? t.bulkGrand : t?.stdGrand)}</div>
          <div style={{ fontSize: 16, color: "#aab" }}>{expanded ? "▲" : "▼"}</div>
        </div>
      </div>

      {expanded && (
        <div style={{ padding: "0 16px 16px", borderTop: "1.5px solid #f0f3fa" }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, margin: "12px 0" }}>
            <MiniStat label="Std Total" value={fmt(t?.stdGrand)} />
            {t?.hasBulk && <MiniStat label="Bulk Total" value={fmt(t.bulkGrand)} teal />}
            <MiniStat label="Your Cost" value={fmt(t?.totalCost)} private />
            <MiniStat label="Your Profit" value={fmt(t?.profit)} teal={t?.profit > 0} />
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => onPreview(quote)} style={{ flex: 1, padding: 9, borderRadius: 8, border: "none", background: NAVY, color: "white", fontFamily: "inherit", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>👁 Preview</button>
            <button onClick={() => onEdit(quote)}    style={{ flex: 1, padding: 9, borderRadius: 8, border: "none", background: "#f0f3fa", color: NAVY, fontFamily: "inherit", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>✏️ Edit</button>
            <button onClick={() => onDelete(quote.id)} style={{ flex: 1, padding: 9, borderRadius: 8, border: "none", background: "#fff0f0", color: "#c0392b", fontFamily: "inherit", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>🗑️ Delete</button>
          </div>
        </div>
      )}
    </div>
  );
}

function copyQuoteText(quote) {
  const t = quote.totals;
  const lines = [
    `QUOTE — ${quote.organization || quote.requestedBy}`,
    `Date: ${quote.date}`,
    quote.requestedBy ? `Requested By: ${quote.requestedBy}` : "",
    quote.organization ? `Organization: ${quote.organization}` : "",
    ``,
    `PRODUCT DESCRIPTION         QTY    PRICE    BULK DISC    TOTAL`,
    `${"─".repeat(60)}`,
  ];
  quote.lines.forEach(line => {
    const c = calcLine(line);
    const hasBulk = c.bulkPrice !== null;
    lines.push(`${line.description}`);
    lines.push(`  Qty: ${line.qty}  |  Price: ${fmt(c.std)}  |  Bulk: ${hasBulk ? line.bulkDiscount + "%" : "—"}  |  Total: ${fmt(hasBulk ? c.bulkSubtotal : c.stdSubtotal)}`);
    if (line.dtfFront) lines.push(`  Front: ${line.dtfFront}`);
    if (line.dtfBack)  lines.push(`  Back: ${line.dtfBack}`);
    if (line.lineFeeLabel && c.lineFee > 0) lines.push(`  ${line.lineFeeLabel}: ${fmt(c.lineFee)}`);
    lines.push("");
  });
  lines.push(`Shipping: ${fmt(quote.shipping || 0)}`);
  t.feeBreakdown?.forEach(f => lines.push(`${f.label}: ${fmt(f.amount)}`));
  lines.push(``, `Standard Order Total: ${fmt(t.stdGrand)}`);
  if (t.hasBulk) {
    lines.push(`Bulk Order Total: ${fmt(t.bulkGrand)}`);
    lines.push(`You Saved: ${fmt(t.saved)}`);
  }
  lines.push(``, `Order more to maximize savings on future bulk tiers!`);
  lines.push(``, `Payment Options:`);
  lines.push(`Zelle: teammerchla@gmail.com`);
  lines.push(`CashApp: $merchlosangeles`);
  lines.push(`Venmo: @merchlosangeles.com`);
  lines.push(``, `Prepared by: Elizabeth@merchlosangeles.com`);
  navigator.clipboard.writeText(lines.filter(Boolean).join("\n"));
}

// ─── Logo Upload ──────────────────────────────────────────────────────────────
function LogoUpload({ logoBase64, onLogo }) {
  const ref = useRef();
  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => onLogo(ev.target.result);
    reader.readAsDataURL(file);
  }
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
      {logoBase64
        ? <img src={logoBase64} alt="logo" style={{ height: 32, objectFit: "contain" }} />
        : <div style={{ fontSize: 12, color: "#8899bb" }}>No logo uploaded</div>
      }
      <button onClick={() => ref.current.click()} style={{ padding: "5px 12px", borderRadius: 7, border: "1.5px solid #dde3ee", background: "white", color: NAVY, fontFamily: "inherit", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
        {logoBase64 ? "Change" : "Upload Logo"}
      </button>
      <input ref={ref} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
    </div>
  );
}

// ─── App Root ─────────────────────────────────────────────────────────────────
const STORAGE_KEY = "mla_quotes_v3";
const LOGO_KEY    = "mla_logo_v1";

function App() {
  const [tab,        setTab]        = useState("new");
  const [quotes,     setQuotes]     = useState([]);
  const [editQuote,  setEditQuote]  = useState(null);
  const [preview,    setPreview]    = useState(null);
  const [toast,      setToast]      = useState("");
  const [logoBase64, setLogoBase64] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const q = await window.storage.get(STORAGE_KEY);
        if (q?.value) setQuotes(JSON.parse(q.value));
        const l = await window.storage.get(LOGO_KEY);
        if (l?.value) setLogoBase64(l.value);
      } catch { }
    })();
  }, []);

  async function persistQuotes(q) {
    setQuotes(q);
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(q)); } catch { }
  }

  async function handleLogo(base64) {
    setLogoBase64(base64);
    try { await window.storage.set(LOGO_KEY, base64); } catch { }
    showToast("Logo saved!");
  }

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(""), 2500); }

  function handleSave(q) {
    const updated = editQuote ? quotes.map(x => x.id === q.id ? q : x) : [q, ...quotes];
    persistQuotes(updated);
    setEditQuote(null);
    setTab("saved");
    showToast(editQuote ? "Quote updated!" : "Quote saved!");
  }

  function handleDelete(id) {
    if (!confirm("Delete this quote?")) return;
    persistQuotes(quotes.filter(q => q.id !== id));
    showToast("Quote deleted.");
  }

  function handleEdit(q) { setEditQuote(q); setTab("new"); }

  return (
    <div style={{ minHeight: "100vh", background: "#f4f6fb", fontFamily: "'Georgia','Times New Roman',serif" }}>
      {/* Header */}
      <div style={{ background: `linear-gradient(135deg, ${NAVY}, #223366)`, padding: "20px 20px 16px", position: "sticky", top: 0, zIndex: 100, boxShadow: "0 4px 20px rgba(26,39,68,0.25)" }}>
        <div style={{ maxWidth: 520, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
            <div style={{ background: TEAL, borderRadius: 10, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 17 }}>🏷️</div>
            <div style={{ flex: 1 }}>
              <div style={{ color: "white", fontWeight: 700, fontSize: 16 }}>MLA Quote Builder</div>
              <div style={{ color: TEAL, fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", fontFamily: "system-ui,sans-serif" }}>Merch Los Angeles</div>
            </div>
            <LogoUpload logoBase64={logoBase64} onLogo={handleLogo} />
          </div>
          <div style={{ display: "flex", background: "rgba(255,255,255,0.1)", borderRadius: 10, padding: 3, gap: 3 }}>
            {[["new", editQuote ? "✏️ Editing" : "＋ New Quote"], ["saved", `📁 Saved (${quotes.length})`]].map(([t, label]) => (
              <button key={t} onClick={() => { setTab(t); if (t === "new" && !editQuote) setEditQuote(null); }} style={{
                flex: 1, padding: 9, borderRadius: 8, border: "none",
                background: tab === t ? "white" : "transparent",
                color: tab === t ? NAVY : "rgba(255,255,255,0.7)",
                fontFamily: "system-ui,sans-serif", fontSize: 13, fontWeight: 700, cursor: "pointer",
              }}>{label}</button>
            ))}
          </div>
        </div>
      </div>

      {/* Body */}
      <div style={{ maxWidth: 520, margin: "0 auto", padding: "20px 16px" }}>
        {tab === "new" && (
          <QuoteForm
            onSave={handleSave}
            editQuote={editQuote || undefined}
            onCancel={editQuote ? () => { setEditQuote(null); setTab("saved"); } : undefined}
            logoBase64={logoBase64}
          />
        )}
        {tab === "saved" && (
          quotes.length === 0
            ? (
              <div style={{ textAlign: "center", padding: "60px 20px", color: "#8899bb" }}>
                <div style={{ fontSize: 48, marginBottom: 12 }}>📋</div>
                <div style={{ fontWeight: 700, color: NAVY, fontSize: 17, marginBottom: 6 }}>No saved quotes yet</div>
                <div style={{ fontSize: 14 }}>Build your first quote to see it here.</div>
                <PrimaryBtn onClick={() => setTab("new")} style={{ marginTop: 20, padding: "13px 32px" }}>＋ New Quote</PrimaryBtn>
              </div>
            )
            : quotes.map(q => (
              <QuoteCard key={q.id} quote={q}
                onDelete={handleDelete}
                onEdit={handleEdit}
                onPreview={q => setPreview(q)} />
            ))
        )}
      </div>

      {/* Preview modal */}
      {preview && <QuotePreview quote={preview} logoBase64={logoBase64} onClose={() => setPreview(null)} />}

      {/* Toast */}
      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: NAVY, color: "white", padding: "12px 24px", borderRadius: 30, fontFamily: "system-ui,sans-serif", fontSize: 14, fontWeight: 600, boxShadow: "0 8px 30px rgba(26,39,68,0.35)", zIndex: 999, whiteSpace: "nowrap", animation: "fadeIn 0.2s ease" }}>
          {toast}
        </div>
      )}

      <style>{`
        * { -webkit-tap-highlight-color: transparent; }
        input:focus, select:focus, textarea:focus { border-color: ${TEAL} !important; box-shadow: 0 0 0 3px rgba(0,180,200,0.15); }
        @keyframes fadeIn { from { opacity:0; transform:translateX(-50%) translateY(8px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
      `}</style>
    </div>
  );
}

const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(React.createElement(App));
</script>
</body>
</html>
